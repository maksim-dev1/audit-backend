services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Порт наружу на хост — вьювер/read-API открывать наружу небезопасно
    # (нет отдельной аутентификации, только статический api_key на /audit/batch),
    # публикуй за реверс-прокси/VPN-туннелем или ограничивай доступ иначе.
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      CONFIG_PATH: /app/config.yaml
      DATABASE_DSN: ${DATABASE_DSN}
      AUDIT_API_KEY: ${AUDIT_API_KEY}
