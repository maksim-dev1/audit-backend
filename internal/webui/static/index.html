<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Log Viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e6e8ec; font-family: -apple-system, 'Segoe UI', sans-serif; }
  button { font-family: inherit; }
  input::placeholder { color: #5c626c; }
  #app { height: 100%; display: flex; flex-direction: column; overflow: hidden; position: relative; }

  .pt-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .pt-scroll::-webkit-scrollbar-track { background: transparent; }
  .pt-scroll::-webkit-scrollbar-thumb { background: #2a2d33; border-radius: 5px; }
  .pt-scroll::-webkit-scrollbar-thumb:hover { background: #3a3f47; }
  .pt-row:hover { background: #ffffff0d !important; }
  .pt-item:hover { background: #ffffff0f !important; }
  .pt-btn:hover { filter: brightness(1.35); }
  .pt-bar:hover { opacity: 1 !important; }
  .pt-node:hover { background: #ffffff08; }
  .pt-node:hover .pt-copy { opacity: 1 !important; }

  /* ---------- topbar ---------- */
  .topbar { flex: none; height: 52px; border-bottom: 1px solid #ffffff12; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: #101317; }
  .picker-wrap { position: relative; }
  .picker-btn { display: flex; align-items: center; gap: 9px; background: #ffffff0a; border: 1px solid #ffffff1f; color: #e6e8ec; border-radius: 8px; padding: 5px 10px 5px 6px; cursor: pointer; }
  .avatar { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font: 600 11px system-ui; flex: none; }
  .picker-name { font: 600 13px system-ui; color: #f1f2f4; line-height: 1.25; text-align: left; }
  .picker-id { font: 10.5px ui-monospace, monospace; color: #7d838d; line-height: 1.25; text-align: left; }
  .picker-caret { color: #6b7178; font: 11px system-ui; margin-left: 4px; }

  .picker-menu { position: absolute; top: 46px; left: 0; width: 326px; background: #15181d; border: 1px solid #ffffff24; border-radius: 11px; box-shadow: 0 20px 48px #000d; z-index: 80; padding: 9px; display: flex; flex-direction: column; gap: 7px; }
  .picker-search { width: 100%; background: #0b0d10; border: 1px solid #ffffff1f; color: #e6e8ec; border-radius: 7px; padding: 8px 10px; font: 12.5px system-ui; outline: none; }
  .picker-list { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .picker-item-name { font: 500 12.5px system-ui; color: #e6e8ec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .picker-item-id { font: 10.5px ui-monospace, monospace; color: #5c626c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .picker-active-tag { font: 10px system-ui; color: #6ea8fe; flex: none; }
  .picker-error-tag { font: 9.5px ui-monospace, monospace; color: oklch(0.8 0.12 25); background: oklch(0.68 0.19 25 / 0.18); border-radius: 4px; padding: 2px 5px; flex: none; }

  .device-info { display: flex; align-items: center; gap: 7px; font: 11px ui-monospace, monospace; color: #7d838d; background: #ffffff08; border-radius: 7px; padding: 5px 9px; }
  .device-info span:nth-child(even) { color: #3f444b; }
  .session-range { font: 11.5px ui-monospace, monospace; color: #5c626c; }

  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .nav-group { display: flex; align-items: center; border-radius: 8px; overflow: hidden; }
  .nav-group-error { background: oklch(0.68 0.19 25 / 0.1); border: 1px solid oklch(0.68 0.19 25 / 0.34); }
  .nav-group-warning { background: oklch(0.82 0.15 80 / 0.08); border: 1px solid oklch(0.82 0.15 80 / 0.3); }
  .nav-count { font: 600 11.5px system-ui; padding: 0 4px 0 10px; }
  .nav-btn { background: none; border: none; font: 12px system-ui; padding: 6px 8px; cursor: pointer; }
  .nav-group-error .nav-btn { border-left: 1px solid oklch(0.68 0.19 25 / 0.3); color: oklch(0.85 0.12 25); }
  .nav-group-warning .nav-btn { border-left: 1px solid oklch(0.82 0.15 80 / 0.26); color: oklch(0.88 0.11 80); }
  .icon-btn { background: #ffffff0a; border: 1px solid #ffffff18; color: #9298a1; border-radius: 8px; padding: 6px 10px; font: 600 11.5px system-ui; cursor: pointer; }

  .overlay-dismiss { position: absolute; inset: 0; top: 52px; z-index: 75; }

  /* ---------- filterbar ---------- */
  .filterbar { flex: none; height: 46px; padding: 0 18px; border-bottom: 1px solid #ffffff12; display: flex; align-items: center; gap: 10px; }
  .search-wrap { position: relative; flex: none; }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #5c626c; font: 12px system-ui; }
  .search-main { background: #15181d; border: 1px solid #ffffff1a; color: #e6e8ec; border-radius: 7px; padding: 7px 10px 7px 27px; font: 12.5px system-ui; width: 300px; outline: none; }

  .scope-tabs { display: flex; background: #15181d; border: 1px solid #ffffff1a; border-radius: 7px; padding: 2px; gap: 2px; }
  .scope-tab { border: none; border-radius: 5px; padding: 5px 11px; font: 600 11.5px system-ui; cursor: pointer; }
  .scope-tab-count { font-weight: 400; margin-left: 6px; }

  .mission-toggle { border-radius: 7px; padding: 6px 10px; font: 600 11.5px system-ui; cursor: pointer; border: 1px solid; }

  .cat-menu-wrap { position: relative; }
  .cat-menu-btn { display: flex; align-items: center; gap: 8px; border-radius: 7px; padding: 6px 10px; font: 600 11.5px system-ui; cursor: pointer; border: 1px solid; }
  .cat-menu { position: absolute; top: 38px; left: 0; width: 340px; background: #15181d; border: 1px solid #ffffff24; border-radius: 11px; box-shadow: 0 20px 48px #000d; z-index: 70; padding: 8px; display: flex; flex-direction: column; }
  .cat-menu-list { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
  .cat-group-title { font: 600 9.5px system-ui; color: #5c626c; text-transform: uppercase; letter-spacing: .06em; padding: 8px 8px 4px; }
  .cat-item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
  .cat-check { width: 14px; height: 14px; border-radius: 4px; border: 1px solid; display: flex; align-items: center; justify-content: center; font: 700 9px system-ui; flex: none; color: #0b0d10; }
  .cat-swatch { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  .cat-label { font: 12px ui-monospace, monospace; color: #c7cad0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-count { font: 11px ui-monospace, monospace; color: #7d838d; min-width: 34px; text-align: right; }
  .cat-menu-actions { display: flex; gap: 6px; border-top: 1px solid #ffffff14; margin-top: 6px; padding-top: 7px; }
  .cat-menu-actions button { flex: 1; background: #ffffff0a; border: 1px solid #ffffff18; color: #9298a1; border-radius: 6px; padding: 6px; font: 600 11px system-ui; cursor: pointer; }

  .range-chip { display: flex; align-items: center; gap: 7px; background: oklch(0.75 0.14 250 / 0.16); border: 1px solid oklch(0.75 0.14 250 / 0.45); color: oklch(0.85 0.1 250); border-radius: 7px; padding: 6px 10px; font: 600 11.5px ui-monospace, monospace; cursor: pointer; }

  .filterbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .reset-link { background: none; border: none; color: #7d838d; font: 11.5px system-ui; cursor: pointer; text-decoration: underline; }
  .count-label { font: 11.5px ui-monospace, monospace; color: #8b9199; }
  .count-label b { color: #e6e8ec; }

  /* ---------- density timeline ---------- */
  .timeline-wrap { flex: none; padding: 9px 18px 6px; background: #0e1013; border-bottom: 1px solid #ffffff12; }
  .timeline-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .timeline-caption { font: 10.5px system-ui; color: #5c626c; }
  .timeline-legend { display: flex; align-items: center; gap: 13px; }
  .timeline-legend-item { display: flex; align-items: center; gap: 5px; font: 10.5px system-ui; color: #8b9199; }
  .swatch { width: 8px; height: 8px; border-radius: 2px; }
  .timeline-track { position: relative; height: 52px; cursor: crosshair; user-select: none; }
  .timeline-bars { position: absolute; left: 0; right: 0; top: 0; height: 34px; }
  .timeline-bar { position: absolute; bottom: 0; border-radius: 1px; }
  .timeline-viewport { position: absolute; top: -3px; bottom: -3px; background: #ffffff14; border: 1px solid #ffffff3d; border-radius: 3px; pointer-events: none; }
  .timeline-dragbox { position: absolute; top: -3px; bottom: -3px; background: oklch(0.75 0.14 250 / 0.22); border: 1px solid oklch(0.75 0.14 250 / 0.6); pointer-events: none; }
  .timeline-baseline { position: absolute; left: 0; right: 0; top: 34px; height: 1px; background: #ffffff14; }
  .timeline-tick { position: absolute; top: 35px; font: 10px ui-monospace, monospace; color: #5c626c; transform: translateX(-50%); }
  .timeline-hover-line { position: absolute; top: 0; height: 34px; width: 1px; background: #ffffff5c; pointer-events: none; }
  .timeline-hover-label { position: absolute; top: -22px; transform: translateX(-50%); background: #22262c; border: 1px solid #ffffff26; border-radius: 5px; padding: 2px 7px; font: 10.5px ui-monospace, monospace; color: #e6e8ec; pointer-events: none; white-space: nowrap; }

  /* ---------- list ---------- */
  .body-row { flex: 1; display: flex; min-height: 0; }
  .list-scroll { flex: 1; overflow-y: auto; min-width: 0; position: relative; }

  .load-earlier { display: block; margin: 10px auto; background: #ffffff0d; border: 1px solid #ffffff26; color: #c7cad0; border-radius: 7px; padding: 7px 16px; font: 600 12px system-ui; cursor: pointer; }
  .load-earlier:disabled { opacity: .5; cursor: default; }

  .group-head { position: sticky; top: 0; z-index: 2; background: #0b0d10f7; backdrop-filter: blur(4px); border-bottom: 1px solid #ffffff0f; padding: 5px 18px; display: flex; align-items: center; gap: 10px; }
  .group-minute { font: 600 11.5px ui-monospace, monospace; color: #9298a1; }
  .group-count { font: 11px system-ui; color: #4e545c; }
  .group-err-badge { margin-left: auto; font: 700 9.5px ui-monospace, monospace; color: oklch(0.85 0.1 25); background: oklch(0.68 0.19 25 / 0.2); border-radius: 4px; padding: 2px 6px; }

  .pt-row { display: grid; grid-template-columns: 104px 148px 1fr 84px; align-items: center; gap: 12px; padding: 0 18px 0 16px; border-bottom: 1px solid #ffffff08; cursor: pointer; }
  .row-time-col { display: flex; align-items: center; gap: 8px; }
  .row-dot { border-radius: 50%; flex: none; }
  .row-time { font: 11.5px ui-monospace, monospace; }
  .row-ms { color: #4e545c; }
  .cat-badge { display: inline-block; max-width: 100%; border-radius: 4px; padding: 2.5px 7px; font: 600 10px ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-name-col { min-width: 0; display: flex; align-items: baseline; gap: 10px; padding: 6px 0; }
  .row-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 52%; }
  .row-meta { font: 11.5px ui-monospace, monospace; color: #6f757e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-badge-col { text-align: right; }
  .row-badge { font: 700 9.5px ui-monospace, monospace; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; padding: 60px; text-align: center; }
  .empty-title { font: 600 15px system-ui; color: #c7cad0; }
  .empty-desc { font: 12.5px system-ui; color: #7d838d; max-width: 340px; }
  .empty-btn { background: #ffffff0f; border: 1px solid #ffffff24; color: #e6e8ec; border-radius: 7px; padding: 8px 14px; font: 600 12px system-ui; cursor: pointer; }

  /* ---------- detail panel ---------- */
  .detail-panel { flex: none; width: 46vw; min-width: 520px; max-width: 900px; background: #0e1013; border-left: 1px solid #ffffff1f; overflow-y: auto; }
  .detail-head { position: sticky; top: 0; background: #0e1013e8; backdrop-filter: blur(6px); border-bottom: 1px solid #ffffff14; padding: 10px 16px; display: flex; align-items: center; gap: 8px; z-index: 5; }
  .detail-nav-btn { background: #ffffff0a; border: 1px solid #ffffff18; color: #9298a1; border-radius: 6px; padding: 5px 9px; font: 11px system-ui; cursor: pointer; }
  .detail-pos { font: 11px ui-monospace, monospace; color: #6b7178; }
  .detail-copy-btn { margin-left: auto; background: #ffffff0a; border: 1px solid #ffffff18; color: #c7cad0; border-radius: 6px; padding: 5px 10px; font: 600 11px system-ui; cursor: pointer; }
  .detail-inner { padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 16px; }
  .detail-top-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .detail-full-time { font: 11px ui-monospace, monospace; color: #6b7178; margin-left: auto; }
  .detail-title { font: 600 16.5px system-ui; line-height: 1.35; color: #f6f7f8; }
  .detail-hint { border-radius: 8px; padding: 9px 11px; font: 12px system-ui; line-height: 1.45; border: 1px solid; }
  .section-title { font: 600 10.5px system-ui; color: #5c626c; text-transform: uppercase; letter-spacing: .05em; }

  .facts-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .fact-chip { border-radius: 8px; padding: 7px 11px; min-width: 96px; border: 1px solid; }
  .fact-label { font: 9.5px system-ui; color: #5c626c; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .fact-value { font: 600 13px ui-monospace, monospace; word-break: break-all; }

  .text-block-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .text-block-note { font: 10.5px ui-monospace, monospace; color: #4e545c; }
  .text-block-copy { margin-left: auto; background: #ffffff0a; border: 1px solid #ffffff18; color: #8b9199; border-radius: 5px; padding: 3px 8px; font: 600 10px system-ui; cursor: pointer; }
  .text-block-pre { margin: 0; background: #08090b; border: 1px solid #ffffff14; border-radius: 8px; padding: 11px 12px; font: 11.5px/1.6 ui-monospace, monospace; color: #b9c3cd; white-space: pre-wrap; word-break: break-word; overflow: auto; }
  .text-block-expand { margin-top: 6px; background: none; border: none; color: #7d838d; font: 11px system-ui; cursor: pointer; text-decoration: underline; }

  .tree-box { background: #08090b; border: 1px solid #ffffff14; border-radius: 8px; padding: 6px 0; overflow: auto; }
  .tree-node { display: flex; align-items: flex-start; gap: 6px; padding: 2.5px 12px; min-height: 19px; }
  .tree-chev { font: 10px ui-monospace, monospace; color: #5c626c; width: 9px; flex: none; padding-top: 2px; }
  .tree-key { font: 600 11.5px ui-monospace, monospace; flex: none; }
  .tree-value { font: 11.5px/1.5 ui-monospace, monospace; word-break: break-all; flex: 1; min-width: 0; }
  .tree-more { font: 10px system-ui; color: #6ea8fe; flex: none; padding-top: 1px; }
  .no-payload { border: 1px dashed #ffffff1f; border-radius: 8px; padding: 11px 13px; font: 12px system-ui; color: #6b7178; }

  .context-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .context-chip { background: #15181d; border: 1px solid #ffffff14; border-radius: 7px; padding: 8px 10px; min-width: 0; }
  .context-chip-label { font: 9.5px system-ui; color: #5c626c; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .context-chip-value { font: 11.5px ui-monospace, monospace; word-break: break-all; }

  .raw-toggle-btn { width: 100%; background: #ffffff0a; border: 1px solid #ffffff18; color: #c7cad0; border-radius: 7px; padding: 8px; font: 600 11.5px system-ui; cursor: pointer; }
  .raw-json { margin: 9px 0 0; background: #08090b; border: 1px solid #ffffff14; border-radius: 8px; padding: 11px 12px; font: 11px/1.55 ui-monospace, monospace; color: #b9c3cd; white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; }

  /* ---------- status bar ---------- */
  .statusbar { flex: none; height: 28px; border-top: 1px solid #ffffff12; background: #101317; display: flex; align-items: center; gap: 16px; padding: 0 18px; font: 11px ui-monospace, monospace; color: #6b7178; }
  .statusbar-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .statusbar-hints { margin-left: auto; display: flex; gap: 14px; flex: none; }
  .statusbar-hints kbd { color: #9298a1; }

  /* ---------- shortcuts modal ---------- */
  .modal-backdrop { position: absolute; inset: 0; background: #000000a6; z-index: 90; display: flex; align-items: center; justify-content: center; }
  .shortcuts-modal { width: 560px; background: #0e1013; border: 1px solid #ffffff1f; border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 60px #000c; }
  .modal-head { display: flex; align-items: center; }
  .modal-title { font: 600 15px system-ui; color: #f1f2f4; }
  .close-btn { margin-left: auto; background: #ffffff0a; border: 1px solid #ffffff18; color: #9298a1; border-radius: 6px; padding: 5px 10px; font: 12px system-ui; cursor: pointer; }
  .shortcut-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 18px; }
  .shortcut-row { display: flex; align-items: center; gap: 10px; }
  .shortcut-key { font: 600 11px ui-monospace, monospace; color: #e6e8ec; background: #ffffff12; border: 1px solid #ffffff1f; border-radius: 5px; padding: 3px 7px; min-width: 46px; text-align: center; }
  .shortcut-desc { font: 12px system-ui; color: #9298a1; }
  .hr { height: 1px; background: #ffffff14; }
  .kind-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .kind-row { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 7px; border: 1px solid #ffffff14; }
  .kind-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .kind-label { font: 11.5px system-ui; color: #c7cad0; flex: 1; }
  .kind-count { font: 11px ui-monospace, monospace; color: #5c626c; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
